name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # שלב 1: הורדת הקוד מהריפו
      - name: Checkout code
        uses: actions/checkout@v4

      # שלב 2: הגדרת Java 17 (נדרש ל-Kotlin ול-Android Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'   # Eclipse Temurin – מומלץ יותר מ-adopt
          java-version: '17'
          cache: 'gradle'           # שמירת Gradle cache להאצת builds עתידיים

      # שלב 3: הרשאות הרצה ל-Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # שלב 4: Lint – בדיקת שגיאות קוד בסיסיות
      - name: Run Lint
        run: ./gradlew lint

      # שלב 5: Unit Tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # שלב 6: בניית APK לדיבאג
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # שלב 7: שמירת ה-APK כ-Artifact להורדה
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7   # שמור 7 ימים בלבד (חוסך storage)
